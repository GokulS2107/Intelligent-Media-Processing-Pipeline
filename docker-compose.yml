version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: media-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=media_pipeline
    networks:
      - media-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: media-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - media-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: media-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/media_pipeline
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb
      - redis
    networks:
      - media-network
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: media-worker
    command: npm run worker
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/media_pipeline
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
    depends_on:
      - mongodb
      - redis
    networks:
      - media-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: media-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - media-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  media-network:
    driver: bridge